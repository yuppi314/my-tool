# 無料プランで最短公開するための設定(カード登録不要)。
# 無料プランは永続ディスクが使えないため、再起動・再デプロイでリード/診断データはリセットされます。
# 本格運用する際は runtime を docker に変え、有料プラン+ディスク(このファイルの過去バージョン参照)に切り替えてください。
services:
  - type: web
    name: kyusei-mayan-fortune
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_URL
        sync: false
      - key: REPORT_PRICE_JPY
        value: 980
      - key: ADMIN_TOKEN
        sync: false

  # Kindle漫画 制作ツール(manga-tool/)。スマホのブラウザからも使えるように公開する。
  - type: web
    name: kindle-manga-tool
    runtime: node
    rootDir: manga-tool
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3100
