<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理統計 | 九星気学×マヤ暦</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>マネタイズ状況</h1>
      <p>診断ごとのリード数・購入数・売上・本音タイプの分布を確認できます</p>
    </header>

    <div class="card">
      <label for="token">管理トークン</label>
      <input type="text" id="token" placeholder="ADMIN_TOKEN を入力" />
      <button class="primary" id="load-btn">読み込む</button>
    </div>

    <div class="card" id="stats-card" style="display:none;">
      <div class="section-title">全体</div>
      <table class="stats-table">
        <tr><td>決済モード</td><td id="s-payment-mode"></td></tr>
        <tr><td>累計リード数(メール取得数)</td><td id="s-leads"></td></tr>
        <tr><td>売上合計(円・両診断の合算)</td><td id="s-revenue"></td></tr>
      </table>

      <div class="section-title">リードの獲得元</div>
      <table class="stats-table" id="s-lead-sources"></table>

      <div class="section-title">生年月日診断(九星気学×マヤ暦)</div>
      <table class="stats-table">
        <tr><td>累計診断数</td><td id="s-diagnoses"></td></tr>
        <tr><td>有料購入数</td><td id="s-paid"></td></tr>
        <tr><td>コンバージョン率</td><td id="s-cvr"></td></tr>
      </table>

      <div class="section-title">本音診断</div>
      <table class="stats-table">
        <tr><td>累計診断数</td><td id="s-honne"></td></tr>
        <tr><td>有料購入数</td><td id="s-honne-paid"></td></tr>
        <tr><td>コンバージョン率</td><td id="s-honne-cvr"></td></tr>
      </table>

      <div class="section-title">価格ABテスト(本音診断)</div>
      <p class="note-text" id="s-price-variants"></p>
      <table class="stats-table" id="s-price-test"></table>

      <div class="section-title">本音タイプの分布(訴求コピー改善に使えます)</div>
      <table class="stats-table" id="s-honne-types"></table>
    </div>
    <p class="error-text" id="admin-error"></p>
  </div>

  <script>
    const PAYMENT_MODE_LABELS = {
      live: 'live(Stripeで課金中)',
      mock: 'mock(購入ボタンで即アンロック。公開サーバーでは使わないでください)',
      comingsoon: 'comingsoon(有料レポートは販売せず「近日公開」として案内中)',
    };

    const LEAD_SOURCE_LABELS = {
      birth: '生年月日診断',
      honne: '本音診断',
      'honne-comingsoon': '本音診断(公開お知らせ登録)',
    };

    const HONNE_TYPE_NAMES = {
      honmei: '本命まっすぐ型',
      shuchaku: '手放せない執着型',
      akogare: '憧れが恋に見えている型',
      soubou: '情でつながる相棒型',
      ambivalent: '好きなのに腹が立つ両価型',
      nagori: '情が残っているだけ型',
      hanare: 'そっと離れたい型',
      mikakutei: 'まだ言葉にならない型',
    };

    document.getElementById('load-btn').addEventListener('click', async () => {
      const token = document.getElementById('token').value;
      const errorEl = document.getElementById('admin-error');
      errorEl.textContent = '';
      try {
        const res = await fetch(`/api/admin/stats?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || '取得に失敗しました。';
          document.getElementById('stats-card').style.display = 'none';
          return;
        }
        document.getElementById('s-payment-mode').textContent = PAYMENT_MODE_LABELS[data.paymentMode] || data.paymentMode;
        document.getElementById('s-leads').textContent = data.leadCount;
        document.getElementById('s-lead-sources').innerHTML = data.leadSources.length
          ? data.leadSources
              .map((r) => `<tr><td>${LEAD_SOURCE_LABELS[r.source] || r.source}</td><td>${r.c}</td></tr>`)
              .join('')
          : '<tr><td>まだデータがありません</td><td>-</td></tr>';
        document.getElementById('s-diagnoses').textContent = data.diagnosisCount;
        document.getElementById('s-paid').textContent = data.paidCount;
        document.getElementById('s-revenue').textContent = data.revenueJpy.toLocaleString();
        document.getElementById('s-cvr').textContent = `${data.conversionRatePercent}%`;
        document.getElementById('s-honne').textContent = data.honneCount;
        document.getElementById('s-honne-paid').textContent = data.honnePaidCount;
        document.getElementById('s-honne-cvr').textContent = `${data.honneConversionRatePercent}%`;
        document.getElementById('s-price-variants').textContent =
          data.honnePriceVariants.length > 1
            ? `テスト中の価格: ${data.honnePriceVariants.map((p) => '¥' + p.toLocaleString()).join(' / ')}`
            : `単価運用中(¥${data.honnePriceVariants[0].toLocaleString()})。HONNE_PRICE_AB に「480,980」のように設定するとABテストが始まります。`;
        document.getElementById('s-price-test').innerHTML =
          '<tr><th>価格</th><th>診断数</th><th>購入数</th><th>CVR</th><th>売上</th></tr>' +
          (data.honnePriceTest.length
            ? data.honnePriceTest
                .map(
                  (r) =>
                    `<tr><td>¥${r.price.toLocaleString()}</td><td>${r.diagnoses}</td><td>${r.purchases}</td><td>${r.conversionRatePercent}%</td><td>¥${r.revenue.toLocaleString()}</td></tr>`
                )
                .join('')
            : '<tr><td colspan="5">まだデータがありません</td></tr>');
        document.getElementById('s-honne-types').innerHTML = data.honneTypeBreakdown.length
          ? data.honneTypeBreakdown
              .map((t) => `<tr><td>${HONNE_TYPE_NAMES[t.type_id] || t.type_id}</td><td>${t.c}</td></tr>`)
              .join('')
          : '<tr><td>まだデータがありません</td><td>-</td></tr>';
        document.getElementById('stats-card').style.display = 'block';
      } catch (err) {
        errorEl.textContent = '通信エラーが発生しました。';
      }
    });
  </script>
</body>
</html>
