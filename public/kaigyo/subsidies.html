<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>補助金・助成金をさがす - 個人事業主 開業サポート</title>
  <link rel="stylesheet" href="/kaigyo/css/kaigyo.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>補助金・助成金をさがす</h1>
      <p>国の補助金検索サイト「jGrants」から、使えそうな支援制度をさがします。
        <br><span class="muted small">※ここに出てくる情報は目安です。実際にもらえるかどうかは、公式ページや窓口で必ず確認してください。都道府県や市区町村だけの制度は、ここに出てこないこともあります。</span>
      </p>
    </header>
    <nav class="tabs" id="kaigyo-nav"></nav>

    <div class="card">
      <h2>さがす</h2>
      <form id="search-form">
        <label for="keyword-preset">よく使われるキーワードから選ぶ(任意)
          <span class="hint">選ぶと下の入力欄に自動で入ります。そのあとで自由に書き換えても大丈夫です。</span>
        </label>
        <select id="keyword-preset">
          <option value="">-- 選んでください --</option>
          <option value="創業">創業・開業したばかりの人向け</option>
          <option value="IT">IT・ホームページ・システム導入</option>
          <option value="DX">DX・デジタル化</option>
          <option value="ものづくり">ものづくり・製造</option>
          <option value="販路開拓">販路開拓・売り上げアップ</option>
          <option value="観光">観光・地域活性化</option>
          <option value="農業">農業・林業・漁業</option>
          <option value="飲食">飲食・小売・サービス業</option>
          <option value="女性">女性・若者・シニアの起業</option>
          <option value="雇用">人を雇う・働き方改善</option>
          <option value="省エネ">省エネ・環境</option>
          <option value="事業承継">事業承継・引き継ぎ</option>
        </select>

        <label for="keyword">キーワード(2文字以上)</label>
        <input type="text" id="keyword" placeholder="例: 創業、IT、飲食" required />

        <label for="prefecture">都道府県(任意)</label>
        <input type="text" id="prefecture" placeholder="例: 東京都" />

        <div class="checkbox-row">
          <input type="checkbox" id="acceptingOnly" checked />
          <div class="label-text">今、応募できるものだけ表示する</div>
        </div>

        <button type="submit" class="btn btn-primary">さがす</button>
      </form>
      <p class="error-text" id="search-error"></p>
    </div>

    <div class="card">
      <h2>検討リスト</h2>
      <div id="bookmark-list"><p class="muted">読み込み中...</p></div>
    </div>

    <div class="card">
      <h2>検索結果</h2>
      <div id="search-results"><p class="muted">キーワードを入れてさがしてみましょう。</p></div>
    </div>
  </div>

  <script src="/kaigyo/js/common.js"></script>
  <script src="/kaigyo/js/subsidies.js"></script>
</body>
</html>
