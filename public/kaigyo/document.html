<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>書類の入力 - 個人事業主 開業サポート</title>
  <link rel="stylesheet" href="/kaigyo/css/kaigyo.css" />
  <style>
    .print-only { display: none; }
    @media print {
      .print-only { display: block; }
      .no-print { display: none !important; }
    }
    .print-only .field-row { margin-bottom: 10px; }
    .print-only .field-label { font-weight: bold; font-size: 13px; color: #444; }
    .print-only .field-value { font-size: 16px; border-bottom: 1px solid #999; padding: 4px 2px; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top no-print">
      <h1 id="doc-title">書類</h1>
      <p id="doc-summary" class="muted"></p>
    </header>
    <nav class="tabs no-print" id="kaigyo-nav"></nav>

    <div class="card no-print">
      <p class="small muted" id="doc-official-name"></p>
      <p class="small">提出先: <span id="doc-where"></span></p>
      <p class="small muted">この画面での入力は下書きです。正式な提出は、印刷した内容を確認したうえで、税務署などの案内に従って行ってください。</p>
    </div>

    <div class="card no-print">
      <form id="doc-form"></form>
      <p class="error-text" id="doc-error"></p>
      <p class="success-text" id="doc-success"></p>
      <button type="button" id="save-btn" class="btn btn-primary">下書きを保存する</button>
      <button type="button" id="print-btn" class="btn btn-secondary">印刷する(PDFとして保存もできます)</button>
      <a href="/kaigyo/documents.html" class="btn btn-secondary">一覧にもどる</a>
    </div>

    <div class="print-only" id="print-view"></div>
  </div>

  <script src="/kaigyo/js/common.js"></script>
  <script src="/kaigyo/js/document.js"></script>
</body>
</html>
