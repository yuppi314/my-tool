<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>個人事業主 開業サポート - ログイン</title>
  <link rel="stylesheet" href="/kaigyo/css/kaigyo.css" />
</head>
<body>
  <div class="wrap" style="max-width:420px;">
    <header class="top">
      <h1>個人事業主 開業サポート</h1>
      <p>自分専用のツールです。決めておいた合言葉を入れてください。</p>
    </header>

    <div class="card">
      <form id="login-form">
        <label for="token">合言葉</label>
        <input type="password" id="token" name="token" placeholder="合言葉を入力" required autofocus />
        <p class="error-text" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">入る</button>
      </form>
    </div>
  </div>

  <script src="/kaigyo/js/common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const res = await fetch('/api/kaigyo/profile', { headers: { 'x-kaigyo-token': encodeURIComponent(token) } });
      if (!res.ok) {
        document.getElementById('login-error').textContent = '合言葉が正しくありません。もう一度お試しください。';
        return;
      }
      setKaigyoToken(token);
      window.location.href = '/kaigyo/index.html';
    });
  </script>
</body>
</html>
