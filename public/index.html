<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今月の吉方位×マイル旅 無料診断</title>
  <meta name="description" content="生年月日とお住まいの地域から、九星気学で今月の吉方位を算出。マイルで行ける開運旅先を無料で提案します。" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>今月の吉方位 × マイル旅</h1>
      <p>生年月日とお住まいの地域を入れるだけ。九星気学で今月の吉方位を出して、マイルで行ける開運旅先を提案します</p>
    </header>

    <div class="card">
      <form id="diagnosis-form">
        <label for="birthdate">生年月日</label>
        <input type="date" id="birthdate" name="birthdate" required />

        <label for="origin">お住まいの地域(方位の基準になります)</label>
        <select id="origin" name="origin" required>
          <option value="">選択してください</option>
        </select>

        <label for="name">お名前(任意)</label>
        <input type="text" id="name" name="name" placeholder="例: 山田 花子" />

        <label for="email">メールアドレス(毎月の吉方位をお届け・任意)</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" />

        <button type="submit" class="primary" id="submit-btn">無料で吉方位を診断する</button>
        <p class="error-text" id="form-error"></p>
      </form>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">吉方位旅とは?</div>
      <p>九星気学では、その月に自分にとって良い「気」が巡る方位へ出かけると、運気が整うと考えられています。
      この診断では、年盤と月盤の両方で吉となる「最大吉方」だけを選び、自宅から100km以上離れた、マイルで行ける旅先を提案します。</p>
    </div>

    <footer class="legal">
      本診断は九星気学の一般的な考え方に基づく娯楽コンテンツです。医療・法律・投資等の専門的助言に代わるものではありません。<br />

      <a href="/terms.html" style="color:#c9c0e8;">利用規約</a> ・
      <a href="/privacy.html" style="color:#c9c0e8;">プライバシーポリシー</a>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
