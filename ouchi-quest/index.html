<title>おうちクエスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Status card (Lv / XP / coins / streak) on top, tabs below, quest cards as a list. */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --surface-2: #e2ebe5;
  --fg: #1d2b25;
  --muted: #5d6f66;
  --line: #cfdcd4;
  --accent: #1f7a5a;
  --accent-fg: #ffffff;
  --coin: #c98a12;
  --coin-soft: #fbf0d6;
  --heart: #c94a5f;
  --heart-soft: #fbe5e9;
  --c-cook: #d0672d; --c-clean: #2f7fa8; --c-wash: #6a62b8; --c-shop: #b0782a; --c-tidy: #2f8a5c; --c-other: #6b7a73;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-pixel: "DotGothic16", "Noto Sans JP", monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a16; --surface: #1a2620; --surface-2: #22322a; --fg: #e4eee8; --muted: #9db1a6; --line: #2e4238;
    --accent: #4cc093; --accent-fg: #0d1a14; --coin: #f0b73e; --coin-soft: #3a3020; --heart: #f07c90; --heart-soft: #3c2228;
    --c-cook: #f08c55; --c-clean: #5fb3dd; --c-wash: #9d95ea; --c-shop: #d9a453; --c-tidy: #5cc58e; --c-other: #9aaaa2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a16; --surface: #1a2620; --surface-2: #22322a; --fg: #e4eee8; --muted: #9db1a6; --line: #2e4238;
  --accent: #4cc093; --accent-fg: #0d1a14; --coin: #f0b73e; --coin-soft: #3a3020; --heart: #f07c90; --heart-soft: #3c2228;
  --c-cook: #f08c55; --c-clean: #5fb3dd; --c-wash: #9d95ea; --c-shop: #d9a453; --c-tidy: #5cc58e; --c-other: #9aaaa2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pixel { font-family: var(--font-pixel); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 26px; font-weight: 900; letter-spacing: .02em; }
.top h1 span { color: var(--accent); }
.mode { font-size: 12px; color: var(--muted); letter-spacing: .06em; }

/* status card */
.status { background: var(--surface); border: 2px solid var(--fg); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; box-shadow: 4px 4px 0 var(--fg); }
.status-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lv { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); flex: none; }
.lv small { font-size: 11px; line-height: 1; margin-top: 4px; }
.lv b { font-family: var(--font-pixel); font-size: 28px; line-height: 1; }
.who { flex: 1; min-width: 0; }
.who h2 { font-size: 18px; }
.xpbar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.stat .v { font-family: var(--font-pixel); font-size: 22px; line-height: 1.2; }
.stat.coin .v { color: var(--coin); }

.thanks-banner { background: var(--heart-soft); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; }
.thanks-banner b { color: var(--heart); font-family: var(--font-display); }

/* tabs */
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs button { border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--heart); color: #fff; font-size: 11px; margin-left: 4px; }

section.panel { display: grid; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec-head h3 { font-size: 17px; }

/* filters */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* quest cards */
.list { display: grid; gap: 10px; }
.quest { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.quest.done { opacity: .55; }
.quest .title { font-weight: 700; font-size: 16px; min-width: 0; }
.quest .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); grid-column: 1; }
.area { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.area::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--area, var(--c-other)); }
.reward-pill { font-family: var(--font-pixel); color: var(--coin); background: var(--coin-soft); border-radius: 6px; padding: 0 6px; font-size: 13px; }
.go { grid-row: 1 / span 2; grid-column: 2; border: 2px solid var(--fg); background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 8px 14px; font-family: var(--font-display); font-weight: 900; box-shadow: 2px 2px 0 var(--fg); }
.go:active { transform: translate(2px, 2px); box-shadow: none; }
.go[disabled] { background: var(--surface-2); color: var(--muted); border-color: var(--line); box-shadow: none; cursor: default; }
.pick { border: 2px dashed var(--coin); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; background: var(--coin-soft); }
.pick h3 { font-size: 15px; color: var(--coin); }

/* rewards */
.reward { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.reward .title { font-weight: 700; flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.heart { background: var(--heart-soft); color: var(--heart); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* log */
.log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 6px; }
.log-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.log .msg { background: var(--heart-soft); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.log .msg b { color: var(--heart); }
.thank-row { display: flex; gap: 6px; flex-wrap: wrap; }
.day-label { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--muted); margin-top: 6px; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); display: grid; gap: 2px; }
.badge.off { opacity: .4; border-style: dashed; }
.badge .bn { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.badge .bd { font-size: 12px; color: var(--muted); }

/* forms */
form.add { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr 1fr; } }
.manage-item { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.manage-item:last-child { border-bottom: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.empty { text-align: center; padding: 22px 14px; border: 2px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* quick request */
form.quick { background: var(--surface); border: 2px solid var(--fg); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
form.quick h3 { font-size: 15px; }
.quick-line { display: flex; gap: 8px; }
.quick-line input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.quick-opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.quick-opts select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; }
.quick-opts .sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
.req { grid-column: 1; font-size: 12px; color: var(--heart); font-weight: 700; }
.req-note { grid-column: 1; font-size: 13px; color: var(--muted); }
.cancel { background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }

/* gift opening */
.gift { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.gift-stage { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 380px; width: 100%; }
.gift-stage .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.box { position: relative; width: 168px; height: 150px; border: 0; background: none; padding: 0; }
.box .body { position: absolute; left: 12px; right: 12px; bottom: 0; height: 104px; background: var(--accent); border: 3px solid var(--fg); border-radius: 8px; }
.box .lid { position: absolute; left: 0; right: 0; top: 18px; height: 34px; background: var(--accent); border: 3px solid var(--fg); border-radius: 8px; transition: transform .7s cubic-bezier(.3,1.6,.5,1), opacity .5s .3s; }
.box .rib-v { position: absolute; left: 50%; width: 24px; margin-left: -12px; top: 18px; bottom: 0; background: var(--coin); border-left: 3px solid var(--fg); border-right: 3px solid var(--fg); transition: opacity .3s; }
.box .bow { position: absolute; left: 50%; top: 0; width: 64px; margin-left: -32px; height: 28px; transition: transform .7s cubic-bezier(.3,1.6,.5,1), opacity .5s .3s; }
.box .bow::before, .box .bow::after { content: ""; position: absolute; top: 0; width: 30px; height: 24px; background: var(--coin); border: 3px solid var(--fg); border-radius: 50% 50% 8px 50%; }
.box .bow::before { left: 0; transform: rotate(-12deg); }
.box .bow::after { right: 0; transform: scaleX(-1) rotate(-12deg); }
.box:not([disabled]) { animation: wiggle 2.4s ease-in-out infinite; }
.box.open .lid, .box.open .bow { transform: translateY(-90px) rotate(-14deg); opacity: 0; }
.box.open .rib-v { opacity: 0; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-4deg); } 88% { transform: rotate(4deg); } 92% { transform: rotate(-3deg); } 96% { transform: rotate(2deg); } }
.letter { background: var(--surface); border: 2px solid var(--fg); border-radius: 16px; box-shadow: 5px 5px 0 var(--fg); padding: 22px 20px; display: grid; gap: 12px; width: 100%; animation: rise .6s ease both; text-align: left; }
.letter .to { font-family: var(--font-display); font-weight: 900; font-size: 20px; }
.letter .body-text { white-space: pre-wrap; line-height: 1.85; font-size: 15px; }
.letter .from { text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.welcome-coins { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--coin-soft); border-radius: 12px; padding: 10px; }
.welcome-coins b { font-family: var(--font-pixel); font-size: 30px; color: var(--coin); line-height: 1; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .box:not([disabled]) { animation: none; } .box .lid, .box .bow { transition: none; } .letter { animation: none; } }
form.add textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; resize: vertical; line-height: 1.7; }

/* celebration */
.pop { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: color-mix(in srgb, var(--bg) 70%, transparent); padding: 24px; }
.pop-card { background: var(--surface); border: 3px solid var(--fg); box-shadow: 6px 6px 0 var(--fg); border-radius: 18px; padding: 22px 26px; text-align: center; display: grid; gap: 6px; max-width: 340px; animation: bounce .5s ease; }
.pop-card .big { font-family: var(--font-pixel); font-size: 40px; color: var(--coin); line-height: 1.1; }
.pop-card h3 { font-size: 22px; }
@keyframes bounce { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .pop-card { animation: none; } .xpbar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>おうち<span>クエスト</span></h1>
    <div class="mode" id="mode">読み込み中…</div>
  </header>

  <div class="status" id="status" aria-live="polite"></div>
  <div id="thanksBanner"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="quest" aria-selected="true">クエスト</button>
    <button role="tab" data-tab="shop" aria-selected="false">ごほうび</button>
    <button role="tab" data-tab="log" aria-selected="false">きろく</button>
    <button role="tab" data-tab="admin" aria-selected="false" id="adminTab" hidden>管理</button>
  </nav>

  <section class="panel" id="panel-quest"></section>
  <section class="panel" id="panel-shop" hidden></section>
  <section class="panel" id="panel-log" hidden></section>
  <section class="panel" id="panel-admin" hidden></section>
</div>
<div id="overlay"></div>

<script>
(() => {
  const AREAS = {
    cook: { label: "料理", color: "var(--c-cook)" },
    clean: { label: "掃除", color: "var(--c-clean)" },
    wash: { label: "洗濯", color: "var(--c-wash)" },
    shop: { label: "買い物", color: "var(--c-shop)" },
    tidy: { label: "片付け", color: "var(--c-tidy)" },
    other: { label: "家の用事", color: "var(--c-other)" },
  };
  const REPEAT = { daily: "毎日", weekly: "毎週", once: "1回だけ" };
  const TITLES = ["おうち見習い", "お手伝いルーキー", "家事のたまご", "頼れる戦力", "家事のエース", "おうちの守護者", "家事マスター", "伝説の家事人"];
  const STARTER_QUESTS = [
    { title: "夕飯の食器を洗う", area: "cook", points: 10, minutes: 15, repeat: "daily" },
    { title: "お風呂掃除", area: "clean", points: 15, minutes: 15, repeat: "daily" },
    { title: "洗濯物を取り込んでたたむ", area: "wash", points: 10, minutes: 10, repeat: "daily" },
    { title: "ゴミ出し", area: "tidy", points: 5, minutes: 5, repeat: "daily" },
    { title: "週末の夕飯を1品つくる", area: "cook", points: 30, minutes: 40, repeat: "weekly" },
    { title: "トイレ掃除", area: "clean", points: 15, minutes: 10, repeat: "weekly" },
    { title: "帰りに牛乳とパンを買ってくる", area: "shop", points: 10, minutes: 10, repeat: "once" },
    { title: "スマホの使い方を教えてくれる", area: "other", points: 20, minutes: 20, repeat: "once" },
  ];
  const STARTER_REWARDS = [
    { title: "好きなスイーツをリクエスト", cost: 50 },
    { title: "皿洗い1回免除券", cost: 80 },
    { title: "夕飯のメニューを決められる", cost: 100 },
    { title: "週末ランチをごちそう", cost: 300 },
  ];
  const PRESET_THANKS = ["ありがとう、助かった！", "さすが！完璧だね", "おかげでゆっくりできたよ"];
  const THANKS_BONUS = 5;
  const DEFAULT_GIFT = { to: "", from: "家族より", bonus: 50, message: "いつも仕事おつかれさま。\n家のこと、手伝ってくれて本当に助かっています。\nささやかだけど、家事がちょっと楽しくなるゲームを用意しました。\nたまったコインで、好きなごほうびと交換してね。" };

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, "0");
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const weekKey = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d); };
  const fmtDay = k => { const [y, m, d] = k.split("-"); const w = "日月火水木金土"[new Date(+y, m - 1, +d).getDay()]; return `${+m}月${+d}日（${w}）`; };
  const fmtTime = t => { const d = new Date(t); return `${d.getHours()}:${pad(d.getMinutes())}`; };

  // ---------- store: shared db when available, this-browser storage otherwise ----------
  const COLS = ["quests", "logs", "rewards", "redemptions", "players"];
  const data = { quests: [], logs: [], rewards: [], redemptions: [], players: [] };
  let db = null, me = "local", isAdmin = true, activePlayer = null, ownerAcct = true, canWrite = true, shared = false, userApi = null;
  const names = {};

  const local = {
    load() { try { return JSON.parse(localStorage.getItem("ouchi-quest") || "null"); } catch { return null; } },
    save() { try { localStorage.setItem("ouchi-quest", JSON.stringify(data)); } catch {} },
  };

  const store = {
    async set(col, id, body) {
      if (db) return db.collection(col).doc(id).set(body);
      data[col] = data[col].filter(d => d.id !== id).concat({ ...body, id }); local.save(); render();
    },
    async update(col, id, patch) {
      if (db) return db.collection(col).doc(id).update(patch);
      data[col] = data[col].map(d => d.id === id ? { ...d, ...patch } : d); local.save(); render();
    },
    async del(col, id) {
      if (db) return db.collection(col).doc(id).delete();
      data[col] = data[col].filter(d => d.id !== id); local.save(); render();
    },
  };
  const guard = p => Promise.resolve(p).catch(e => {
    if (e && e.code === "invalid_argument") { canWrite = false; toast("この画面からは記録できません。共有設定を確認してください"); render(); }
    else toast("保存できませんでした。少し待ってからもう一度どうぞ");
  });

  // ---------- derived numbers ----------

      el("div", { class: "small muted" }, "娘さんが初めて開いたとき、ギフトボックスを開けるとこのメッセージが表示されます。"),
      el("div", { class: "row" },
        el("label", { class: "field" }, "あて名", el("input", { id: "gto", name: "gto", value: g.to || "", placeholder: "例：さきちゃんへ", maxlength: "20" })),
        el("label", { class: "field" }, "差出人", el("input", { id: "gfrom", name: "gfrom", value: g.from || "", placeholder: "例：お母さんより", maxlength: "20" })),
        el("label", { class: "field" }, "はじめのコイン", el("select", { id: "gbonus", name: "gbonus" }, [0, 30, 50, 100].map(n => el("option", { value: n, selected: n === (g.bonus ?? 50) }, n ? `${n}コイン` : "なし"))))),
      el("label", { class: "field" }, "メッセージ", el("textarea", { id: "gmsg", name: "gmsg", rows: "6", maxlength: "400" }, g.message || "")),
      el("div", { class: "thank-row" },
        el("button", { class: "btn primary", type: "submit", disabled: !canWrite }, "保存する"),
        el("button", { class: "btn", type: "button", onclick: e => { const f = e.target.form; showGift(true, { to: f.gto.value.trim(), from: f.gfrom.value.trim() || "家族より", message: f.gmsg.value.trim() || DEFAULT_GIFT.message, bonus: +f.gbonus.value || 0 }); } }, "見え方を確認"))));

    // add quest
    const qf = el("form", { class: "add", onsubmit: e => {
      e.preventDefault(); const f = e.target;
      const title = f.qtitle.value.trim(); if (!title) return;
      guard(store.set("quests", uid(), { title, area: f.qarea.value, points: Math.max(1, +f.qpoints.value || 10), minutes: +f.qmin.value || 0, repeat: f.qrepeat.value, active: true, createdAt: Date.now() }));
      f.qtitle.value = ""; toast("クエストを追加しました");
    } },
      el("h3", { style: "font-size:16px" }, "クエストを追加"),
      el("label", { class: "field" }, "内容", el("input", { id: "qtitle", name: "qtitle", placeholder: "例：玄関の靴をそろえる", maxlength: "40", required: true })),
      el("div", { class: "row" },
        el("label", { class: "field" }, "ジャンル", el("select", { id: "qarea", name: "qarea" }, Object.entries(AREAS).map(([k, a]) => el("option", { value: k }, a.label)))),
        el("label", { class: "field" }, "コイン", el("input", { id: "qpoints", name: "qpoints", type: "number", min: "1", max: "500", value: "10" })),
        el("label", { class: "field" }, "目安（分）", el("input", { id: "qmin", name: "qmin", type: "number", min: "0", max: "300", value: "10" })),
        el("label", { class: "field" }, "くり返し", el("select", { id: "qrepeat", name: "qrepeat" }, Object.entries(REPEAT).map(([k, v]) => el("option", { value: k }, v))))),
      el("button", { class: "btn primary", type: "submit", disabled: !canWrite }, "追加する"));
    p.append(qf);

    p.append(el("div", { class: "card" }, el("h3", { style: "font-size:15px;margin-bottom:4px" }, "クエスト一覧"),
      data.quests.length ? [...data.quests].sort((a, b) => (a.area > b.area) - (a.area < b.area)).map(q => el("div", { class: "manage-item" },
        el("span", {}, q.title, el("span", { class: "small muted" }, `  ${(AREAS[q.area] || AREAS.other).label}・${q.points}コイン・${REPEAT[q.repeat]}`)),
        el("button", { class: "btn ghost small", onclick: () => guard(store.del("quests", q.id)) }, "削除"))) : el("div", { class: "small muted" }, "まだありません")));

    // add reward
    p.append(el("form", { class: "add", onsubmit: e => {
      e.preventDefault(); const f = e.target; const title = f.rtitle.value.trim(); if (!title) return;
      guard(store.set("rewards", uid(), { title, cost: Math.max(1, +f.rcost.value || 50), createdAt: Date.now() }));
      f.rtitle.value = ""; toast("ごほうびを追加しました");
    } },
      el("h3", { style: "font-size:16px" }, "ごほうびを追加"),
      el("label", { class: "field" }, "内容", el("input", { id: "rtitle", name: "rtitle", placeholder: "例：駅前のケーキ屋さんのケーキ", maxlength: "40", required: true })),
      el("label", { class: "field" }, "必要コイン", el("input", { id: "rcost", name: "rcost", type: "number", min: "1", max: "5000", value: "100" })),
      el("button", { class: "btn primary", type: "submit", disabled: !canWrite }, "追加する")));
    p.append(el("div", { class: "card" }, el("h3", { style: "font-size:15px;margin-bottom:4px" }, "ごほうび一覧"),
      data.rewards.length ? [...data.rewards].sort((a, b) => a.cost - b.cost).map(r => el("div", { class: "manage-item" },
        el("span", {}, r.title, el("span", { class: "small muted" }, `  ${r.cost}コイン`)),
        el("button", { class: "btn ghost small", onclick: () => guard(store.del("rewards", r.id)) }, "削除"))) : el("div", { class: "small muted" }, "まだありません")));
  }

  // ---------- actions ----------
  async function complete(q) {
    if (doneNow(q)) return;
    if (!canPlay()) return;
    const before = statsFor(who()).lv;
    const log = { questId: q.id, title: q.title, area: q.area, points: q.points, by: who(), at: Date.now() };
    const id = uid();
    if (db) data.logs = data.logs.concat({ ...log, id }); // show it right away; the snapshot confirms
    await guard(store.set("logs", id, log));
    const after = statsFor(who());
    celebrate(q, after, after.lv > before);
  }
  function thank(l, text) {
    thankOpen = null;
    guard(store.update("logs", l.id, { thanks: text, thankedBy: playersMode() ? (who() || "parent") : me, thankedAt: Date.now(), bonus: THANKS_BONUS }));
    toast("ありがとうを送りました");
  }
  function redeem(r) {
    confirmReward = null;
    if (!canPlay() || statsFor(who()).coins < r.cost) return;
    guard(store.set("redemptions", uid(), { rewardId: r.id, title: r.title, cost: r.cost, by: who(), at: Date.now(), status: "requested" }));
    toast(`「${r.title}」と交換しました`);
  }
  async function addStarter() {
    for (const q of STARTER_QUESTS) await guard(store.set("quests", uid(), { ...q, active: true, createdAt: Date.now() }));
    for (const r of STARTER_REWARDS) await guard(store.set("rewards", uid(), { ...r, createdAt: Date.now() }));
    toast("おすすめセットを追加しました");
  }

  // ---------- gift ----------
  let gift = null, giftSeen = null, giftShown = false;
  function saveGift(body) {
    if (db) guard(db.doc("settings/gift").set(body).then(() => toast("メッセージを保存しました")));
    else { gift = body; try { localStorage.setItem("ouchi-quest-gift", JSON.stringify(body)); } catch {} toast("メッセージを保存しました"); render(); }
  }
  function maybeShowGift() {
    if (!gift || giftShown) return;
    // the account holder (e.g. a friend you gave this to) gets it once, then each player on first pick
    if (!ownerAcct && giftSeen === false) showGift(false, gift, true);
    else if (playersMode()) {
      const pl = data.players.find(p => p.id === activePlayer);
      if (pl && !pl.giftOpened) showGift(false, { ...gift, to: gift.to || `${pl.name}へ` });
    }
  }
  function showGift(preview, g, forAccount) {
    giftShown = true;
    const o = $("#overlay");
    const close = () => { o.replaceChildren(); giftShown = false; render(); };
    const stage = el("div", { class: "gift-stage" });
    const box = el("button", { class: "box", "aria-label": "プレゼントをひらく" }, el("span", { class: "body" }), el("span", { class: "rib-v" }), el("span", { class: "lid" }), el("span", { class: "bow" }));
    stage.append(
      el("div", { class: "eyebrow" }, preview ? "プレビュー" : "A GIFT FOR YOU"),
      el("h2", { style: "font-size:22px" }, g.to ? `${g.to}、プレゼントが届いています` : "プレゼントが届いています"),
      box,
      el("div", { class: "small muted", id: "giftHint" }, "タップしてひらく"));
    box.addEventListener("click", async () => {
      box.classList.add("open"); box.disabled = true;
      const hint = $("#giftHint"); if (hint) hint.remove();
      if (!preview) {
        const pid = forAccount ? (playersMode() ? null : me) : who();
        if (forAccount) { giftSeen = true; if (db) guard(db.doc(`data/users/${me}/profile`).set({ giftOpened: Date.now() })); }
        else guard(store.update("players", pid, { giftOpened: Date.now() }));
        if (pid && g.bonus > 0 && !data.logs.some(l => l.id === "gift-" + pid))
          await guard(store.set("logs", "gift-" + pid, { questId: "gift", title: "プレゼント開封ボーナス", area: "other", points: g.bonus, by: pid, at: Date.now(), gift: true }));
      }
      setTimeout(() => stage.append(el("div", { class: "letter" },
        g.to ? el("div", { class: "to" }, g.to) : null,
        el("div", { class: "body-text" }, g.message),
        el("div", { class: "from" }, g.from),
        g.bonus > 0 ? el("div", { class: "welcome-coins" }, el("span", {}, "はじめのコイン"), el("b", {}, `+${g.bonus}`)) : null,
        el("button", { class: "btn primary", style: "justify-self:center;padding:10px 22px", onclick: close }, preview ? "プレビューを閉じる" : "おうちクエストをはじめる"))), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550);
    });
    o.replaceChildren(el("div", { class: "gift", role: "dialog", "aria-label": "プレゼント" }, stage));
    box.focus();
  }

  function celebrate(q, s, leveled) {
    const o = $("#overlay");
    const close = () => o.replaceChildren();
    const lines = ["ナイス！", "助かる〜！", "おみごと！", "さすが！", "グッジョブ！"];
    o.replaceChildren(el("div", { class: "pop", onclick: close },
      el("div", { class: "pop-card", role: "dialog", "aria-label": "クエストクリア" },
        el("div", { class: "small muted" }, "QUEST CLEAR"),
        el("h3", {}, lines[Math.floor(Math.random() * lines.length)]),
        el("div", { class: "big" }, `+${q.points}`),
        el("div", { class: "small" }, q.title),
        leveled ? el("div", { style: "font-family:var(--font-display);font-weight:900;color:var(--accent)" }, `レベルアップ！ Lv${s.lv}「${TITLES[Math.min(s.lv - 1, TITLES.length - 1)]}」`) : null,
        s.streak >= 2 ? el("div", { class: "small muted" }, `${s.streak}日連続クリア中`) : null,
        el("button", { class: "btn primary", style: "margin-top:6px", onclick: close }, "とじる"))));
    setTimeout(close, 4500);
  }
  let toastTimer;
  function toast(msg) {
    clearTimeout(toastTimer);
    const o = document.getElementById("toast") || document.body.appendChild(el("div", { id: "toast", class: "toast", role: "status" }));
    o.textContent = msg; o.hidden = false;
    toastTimer = setTimeout(() => o.hidden = true, 2400);
  }

  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.dataset.tab; thankOpen = null; confirmReward = null;
    try { localStorage.setItem("ouchi-quest-tab", tab); } catch {}
    render();
  });

  // ---------- boot ----------
  const saved = local.load();
  if (saved) COLS.forEach(c => data[c] = saved[c] || []);
  try { gift = JSON.parse(localStorage.getItem("ouchi-quest-gift") || "null"); } catch {}
  try { activePlayer = localStorage.getItem("ouchi-quest-player") || null; } catch {}
  render();

  (async () => {
    const claude = window.claude;
    if (!claude || !claude.use) return;
    const [dbNs, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!dbNs) return; // keep the this-browser mode
    userApi = u;
    const id = u ? await u.id() : null;
    if (!id) return;
    db = dbNs; me = id; shared = true;
    ownerAcct = u ? await u.isOwner() : false;
    isAdmin = ownerAcct || (u ? await u.canEdit() : false);
    const w = u ? await u.can("data.write") : null;
    canWrite = w !== false;
    COLS.forEach(c => data[c] = []);
    render();
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      data[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      resolveNames();
      render();
      if (c === "players") maybeShowGift();
    }, () => {}));
    db.doc("settings/gift").onSnapshot(d => { gift = d.exists ? d.data() : null; maybeShowGift(); render(); }, () => {});
    try { const prof = await db.doc(`data/users/${me}/profile`).get(); giftSeen = !!(prof.exists && prof.data().giftOpened); }
    catch { giftSeen = true; }
    maybeShowGift();
  })();

  async function resolveNames() {
    if (!userApi) return;
    const ids = [...new Set([...data.logs.flatMap(l => [l.by, l.thankedBy]), ...data.redemptions.map(r => r.by), ...data.quests.map(q => q.requestedBy)].filter(Boolean))];
    const missing = ids.filter(i => !(i in names) && i !== me && i !== "parent" && !i.startsWith("p_"));
    if (!missing.length) return;
    const ps = await userApi.profiles(missing);
    let changed = false;
    for (const i of missing) { names[i] = (ps[i] && ps[i].name) || "家族"; changed = true; }
    if (changed) render();
  }
})();
</script>
