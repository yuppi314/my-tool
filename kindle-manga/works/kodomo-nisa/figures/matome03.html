<div class="bar"></div>
<div class="ch">第3章 まとめ</div>
<div class="sub">学資保険と、どっちがいいの？</div>
<h1>比べるべきは<br>利回りではない</h1>
<div class="pts"><div class="pt"><div class="no">1</div><div class="tx"><div class="t">「増えるか」だけで比べない</div><div class="d">先に決めるのは、守りが要るかどうかです。そこが決まらないと数字を比べても答えは出ません。</div></div></div><div class="pt"><div class="no">2</div><div class="tx"><div class="t">親に万一があったとき</div><div class="d">学資保険は以後の保険料が免除され、満期金は受け取れます。こどもNISAにこの仕組みはありません。</div></div></div><div class="pt"><div class="no">3</div><div class="tx"><div class="t">両方持つ選択もある</div><div class="d">どちらか一方に全額入れる必要はありません。役割で分けている家庭も普通にあります。</div></div></div></div>
<div class="q"><div class="lb">あなたの場合は</div><div class="t">わが家に必要なのは<br>守りですか 増やすことですか</div></div>
<div class="page">— まとめ 3 —</div>
