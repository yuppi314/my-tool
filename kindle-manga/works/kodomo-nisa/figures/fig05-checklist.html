<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
.step{background:#fff;border:3px solid #EDE4D6;border-radius:24px;padding:40px 44px;margin-bottom:32px;}
.hd{display:flex;align-items:center;gap:26px;}
.num{width:76px;height:76px;flex:none;border-radius:50%;background:#1F7A6B;color:#fff;font-size:44px;
     display:flex;align-items:center;justify-content:center;}
.hd .t{font-size:54px;line-height:1.25;}
.bd{font-size:40px;line-height:1.55;margin-top:22px;}
.items{margin-top:20px;}
.item{display:flex;align-items:flex-start;gap:20px;font-size:42px;line-height:1.4;margin-top:16px;}
.box{width:44px;height:44px;flex:none;border:5px solid #B8AE9E;border-radius:8px;margin-top:6px;}
.warnbox{background:#FBF1E2;border:3px solid #E4CFA6;border-radius:24px;padding:36px 44px;}
.warnbox .t{font-size:46px;line-height:1.35;}
.warnbox .s{font-size:34px;color:#7A5A22;line-height:1.5;margin-top:14px;}
</style></head><body>
<div class="eyebrow">第5章 まとめ</div>
<h1>10月1日に<br><span class="sm">やること 3つ</span></h1>
<div class="rule"></div>
<div class="step"><div class="hd"><div class="num">1</div><div class="t">どこで開くか決める</div></div>
 <div class="bd">親が使っている金融機関と同じにすると、<br>手続きも管理もいちばん楽です。</div></div>
<div class="step"><div class="hd"><div class="num">2</div><div class="t">書類をそろえる</div></div>
 <div class="items">
  <div class="item"><div class="box"></div><div>子どものマイナンバー</div></div>
  <div class="item"><div class="box"></div><div>続柄がわかる書類</div></div>
  <div class="item"><div class="box"></div><div>親の本人確認書類</div></div>
 </div>
 <div class="note" style="margin-top:20px;">必要書類は金融機関によって異なります。<br>申込前に各社の案内で最新の情報を確認してください。</div></div>
<div class="step"><div class="hd"><div class="num">3</div><div class="t">積立額を決める</div></div>
 <div class="bd">上限は年60万円ですが、満額である必要はありません。<br>月1万円でも立派な積立です。</div></div>
<div class="warnbox"><div class="t">生活費と教育費は 絶対に別</div>
 <div class="s">値下がりする年は必ず来ます。そこでやめると損が確定します。<br>途中でやめなくて済む金額から始めてください。</div></div>
<div class="page">— 図解 4 —</div>
</body></html>
