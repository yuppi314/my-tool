<div class="bar"></div>
<div class="ch">第1章 まとめ</div>
<div class="sub">うちの子の口座、どうすればいいの？</div>
<h1>「決められない」のは<br>あなたのせいではない</h1>
<div class="pts"><div class="pt"><div class="no">1</div><div class="tx"><div class="t">選択肢が2つある以上 迷って当然</div><div class="d">学資保険もこどもNISAも、どちらも国が用意した制度です。片方が正しくて片方が間違い、という話ではありません。</div></div></div><div class="pt"><div class="no">2</div><div class="tx"><div class="t">「投資が怖い」という感覚は正しい</div><div class="d">増える可能性があるものは、減る可能性もあります。その不安を消そうとしなくて大丈夫です。</div></div></div><div class="pt"><div class="no">3</div><div class="tx"><div class="t">危ないのは 迷うことではない</div><div class="d">知らないまま期限が過ぎることです。決めるのは後でも、知るのは今できます。</div></div></div></div>
<div class="q"><div class="lb">あなたの場合は</div><div class="t">わが家は いつまでに決めますか</div></div>
<div class="page">— まとめ 1 —</div>
