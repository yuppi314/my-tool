<div class="bar"></div>
<div class="ch">第5章 まとめ</div>
<div class="sub">10月1日、まず何をする？</div>
<h1>完璧に理解してから<br>始めなくていい</h1>
<div class="pts"><div class="pt"><div class="no">1</div><div class="tx"><div class="t">口座を開くだけならお金はかからない</div><div class="d">開設してから考えても遅くありません。まず器を用意する、で十分です。</div></div></div><div class="pt"><div class="no">2</div><div class="tx"><div class="t">金額は後から変えられる</div><div class="d">月1万円で始めて、慣れてから増やせます。最初から上限を狙う必要はありません。</div></div></div><div class="pt"><div class="no">3</div><div class="tx"><div class="t">生活費を削ってまではやらない</div><div class="d">値下がりした年に耐えられなくなります。続けられる金額であることが、何より大事です。</div></div></div></div>
<div class="q"><div class="lb">あなたの場合は</div><div class="t">来月 最初のひとつは何をしますか</div></div>
