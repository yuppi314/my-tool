<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css"><style>
body{padding:104px 84px;}

<div class="bar"></div>
<div class="ch">第4章 まとめ</div>
<div class="sub">12歳の壁と、18歳の贈り物</div>

<div class="pts"><div class="pt"><div class="no">1</div><div class="tx"><div class="t">12歳まで引き出せない</div><div class="d">中学受験を考えているなら、その費用は別の場所に置く必要があります。ここが最大の注意点です。</div></div></div><div class="pt"><div class="no">2</div><div class="tx"><div class="t">大学費用とは相性がいい</div><div class="d">18年後に使うお金なら、途中で引き出せないことは、むしろ守りになります。</div></div></div><div class="pt"><div class="no">3</div><div class="tx"><div class="t">口座は子ども名義</div><div class="d">親が自由に使えるお金ではありません。渡す前提のお金として扱ってください。</div></div></div></div>
<div class="q"><div class="lb">あなたの場合は</div><div class="t">このお金は 何歳のときに使うお金ですか</div></div>
