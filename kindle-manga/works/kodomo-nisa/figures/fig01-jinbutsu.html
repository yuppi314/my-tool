<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
.cast{display:flex;flex-direction:column;gap:40px;}
.row{display:flex;gap:44px;align-items:flex-end;background:#fff;border:3px solid #EDE4D6;border-radius:24px;padding:36px 44px;}
.row img{height:460px;width:auto;object-fit:contain;}
.row.kid img{height:290px;}
.info{flex:1;padding-bottom:16px;}
.nm{font-size:58px;line-height:1.2;}
.nm .age{font-size:36px;color:#7A7168;margin-left:16px;}
.role{display:inline-block;font-size:32px;color:#fff;background:#B4762E;border-radius:999px;padding:10px 26px;margin:20px 0 22px;}
.role.b{background:#1F7A6B;}.role.c{background:#8A7F72;}
.desc{font-size:42px;line-height:1.5;}
</style></head><body>
<div class="eyebrow">第1章 まとめ</div>
<h1>この本に出てくる<span class="sm"> 3人</span></h1>
<div class="rule"></div>
<div class="cast">
<div class="row"><img src="crop_KANA.png" alt=""><div class="info">
  <div class="nm">白木 かな<span class="age">32歳</span></div>
  <div class="role">この本の主人公</div>
  <div class="desc">時短勤務のワーママ。<br>投資はまったくの未経験で<br>学資保険の資料を3ヶ月放置中。</div></div></div>
<div class="row"><img src="crop_AYUMI.png" alt=""><div class="info">
  <div class="nm">森下 あゆみ<span class="age">38歳</span></div>
  <div class="role b">教えてくれる先輩ママ</div>
  <div class="desc">保育園で知り合った2児の母。<br>専門家ではなく実践者として<br>自分の言葉で話してくれる。</div></div></div>
<div class="row kid"><img src="crop_HINATA.png" alt=""><div class="info">
  <div class="nm">白木 ひなた<span class="age">1歳</span></div>
  <div class="role c">かなの娘</div>
  <div class="desc">よく食べてよく眠る。<br>18年後には18歳になる。</div></div></div>
</div>
<div class="foot"><div class="big">お金の話は ひとりで抱えると重い</div>
<div class="sub">この本は、そんな2人の会話でできています。</div></div>
<div class="page">— 図解 1 —</div>
</body></html>
