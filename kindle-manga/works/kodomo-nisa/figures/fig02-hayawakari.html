<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
.card{background:#fff;border:3px solid #EDE4D6;border-radius:24px;padding:40px 42px;}
.card .lb{font-size:36px;color:#7A7168;letter-spacing:.04em;}
.card .vl{font-size:76px;line-height:1.2;margin-top:16px;letter-spacing:-.01em;}
.card .vl.s{font-size:56px;}
.card .nt{font-size:32px;color:#8A7F72;margin-top:16px;line-height:1.4;}
.card.hi{background:#1F7A6B;border-color:#1F7A6B;}
.card.hi .lb{color:#A9D5CC;}.card.hi .vl{color:#fff;}.card.hi .nt{color:#CFE7E2;}
.wide{grid-column:1 / -1;}
</style></head><body>
<div class="eyebrow">第2章 まとめ</div>
<h1>こどもNISA<br><span class="sm">早わかり</span></h1>
<div class="rule"></div>
<div class="grid">
 <div class="card"><div class="lb">対象になる年齢</div><div class="vl">0〜17歳</div><div class="nt">生まれてすぐ口座を作れる</div></div>
 <div class="card"><div class="lb">使える枠</div><div class="vl s">つみたて<br>投資枠だけ</div><div class="nt">国が選んだ投資信託のみ</div></div>
 <div class="card"><div class="lb">1年で入れられる額</div><div class="vl">60万円</div><div class="nt">月5万円まで 満額でなくてよい</div></div>
 <div class="card"><div class="lb">ぜんぶで入れられる額</div><div class="vl">600万円</div><div class="nt">この分の運用益が非課税</div></div>
 <div class="card"><div class="lb">制度が始まる日</div><div class="vl s">2027年<br>1月</div><div class="nt">積立を始められるのはここから</div></div>
 <div class="card hi"><div class="lb">口座の申し込み受付</div><div class="vl s">2026年<br>10月1日</div><div class="nt">制度開始より前に動ける</div></div>
</div>
<div class="foot"><div class="big">差がつくのは 枠ではなく 期間</div>
<div class="sub">600万円の枠は 年60万円ずつなら10年で埋まります。<br>0歳から始める利点は、お金を置いておける期間が18年あることです。</div></div>
<div class="page">— 図解 2 —</div>
</body></html>
