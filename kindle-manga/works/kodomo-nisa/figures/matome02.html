<div class="bar"></div>
<div class="ch">第2章 まとめ</div>
<div class="sub">こどもNISAって、何？</div>
<h1>NISAは<br>もうかる制度ではない</h1>
<div class="pts"><div class="pt"><div class="no">1</div><div class="tx"><div class="t">NISAは「箱」の名前</div><div class="d">投資商品の名前ではありません。中で増えた分に税金がかからなくなる、入れ物の名前です。</div></div></div><div class="pt"><div class="no">2</div><div class="tx"><div class="t">箱に入れただけでは増えない</div><div class="d">何を入れるかは自分で選びます。そして選んだものが育つかどうかは、誰にも保証できません。</div></div></div><div class="pt"><div class="no">3</div><div class="tx"><div class="t">18年かけて育てる設計</div><div class="d">こどもNISAは短期で増やす道具ではありません。時間をかけられる人ほど向いています。</div></div></div></div>
<div class="q"><div class="lb">あなたの場合は</div><div class="t">18年後 この子にいくら渡したいですか</div></div>
<div class="page">— まとめ 2 —</div>
