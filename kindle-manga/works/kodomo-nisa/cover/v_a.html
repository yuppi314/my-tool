<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
body { background:#0E2851; display:flex; flex-direction:column; }
.art { height:1360px; overflow:hidden; position:relative; }
.art img { margin-top:-120px; }
.art::after { content:""; position:absolute; inset:auto 0 0 0; height:110px;
  background:linear-gradient(to bottom, rgba(14,40,81,0), #0E2851); }
.badge { position:absolute; top:44px; left:50%; transform:translateX(-50%);
  background:#E8B04B; color:#0E2851; font-size:54px; font-weight:bold;
  padding:16px 52px; border-radius:60px; letter-spacing:.06em; white-space:nowrap; }
.band { flex:1; padding:0 70px 64px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; color:#fff; text-align:center; }
.pre { font-size:64px; letter-spacing:.16em; color:#C6D4EA; }
.main { font-size:222px; font-weight:bold; line-height:1.0; margin:8px 0 34px; }
.hook { font-size:132px; font-weight:bold; color:#F5C65B; line-height:1.12;
  letter-spacing:.01em; }
.hook .u { border-bottom:10px solid #F5C65B; padding-bottom:6px; }
.foot { font-size:50px; color:#AFC0DA; margin-top:38px; line-height:1.4; }
.author { font-size:46px; color:#8FA3C4; letter-spacing:.12em; margin-top:26px; }
</style>
<div class="art"><img src="art_s.png"><div class="badge">2027年スタート</div></div>
<div class="band">
  <div class="pre">漫画でわかる</div>
  <div class="main">こどもNISA</div>
  <div class="hook">0歳から<br><span class="u">600万円</span>、非課税。</div>
  <div class="foot">口座開設の受付は 2026年10月1日から</div>
  <div class="author">あさひ なぎさ</div>
</div>
