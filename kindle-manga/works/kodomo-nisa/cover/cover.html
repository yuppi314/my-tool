<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:2560px;overflow:hidden}
body{font-family:"IPAPGothic","IPAGothic",sans-serif;background:#fff;color:#232323;position:relative}
.hero{position:relative;height:1245px}
.photo{position:absolute;right:0;top:52px;width:880px;height:1170px;overflow:hidden}
.photo img{width:1180px;margin-left:-170px;margin-top:-40px;display:block}
/* 絵の左端を白へ溶かして切り抜き風にする */
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to right,#fff 0,rgba(255,255,255,.85) 90px,rgba(255,255,255,0) 300px),
             linear-gradient(to bottom,rgba(255,255,255,0) 1000px,#fff 1170px)}
.copy{position:absolute;left:70px;top:88px;width:920px}
.tag{font-size:40px;line-height:1.4;font-weight:bold;color:#4A4A4A}
.tagline{width:460px;height:7px;background:#E8546B;margin:18px 0 34px;border-radius:4px}
.t1{font-size:146px;font-weight:bold;letter-spacing:.01em;line-height:1.06}
.t2{font-size:248px;font-weight:bold;color:#E8546B;line-height:1.0;margin-top:6px;
    text-shadow:0 5px 0 rgba(0,0,0,.06)}
.t3{font-size:46px;font-weight:bold;color:#4A4A4A;line-height:1.5;margin-top:40px}
.bubble{position:absolute;right:52px;top:44px;width:330px;height:330px;border-radius:50%;
  background:#E8546B;color:#fff;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:52px;font-weight:bold;line-height:1.3;
  box-shadow:0 0 0 14px #fff, 0 0 0 24px #FBD9DF}
.qs{display:flex;gap:34px;padding:0 74px;margin-top:8px}
.q{flex:1;text-align:center}
.q .circ{width:250px;height:250px;border-radius:50%;background:#FCE9ED;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center}
.q .circ svg{width:120px;height:120px}
.q .lbl{font-size:40px;font-weight:bold;line-height:1.35;color:#333}
.band{margin-top:56px;background:#E8546B;color:#fff;padding:54px 74px 60px;text-align:center}
.band .big{font-size:86px;font-weight:bold;line-height:1.25;letter-spacing:.01em}
.band .big .l2{display:block;font-size:132px;line-height:1.12;margin-top:6px}
.band .big .y{color:#FFE06B}
.band .rule{width:640px;height:8px;background:rgba(255,255,255,.55);margin:26px auto 0;border-radius:4px}
.cols{display:flex;padding:52px 60px 0}
.cols .c{flex:1;text-align:center;font-size:38px;font-weight:bold;line-height:1.45;color:#3A3A3A;padding:0 22px}
.cols .c + .c{border-left:4px solid #F0C7CE}
.author{text-align:center;font-size:48px;font-weight:bold;color:#4A4A4A;
  letter-spacing:.12em;padding:46px 0 0}
</style>

<div class="hero">
  <div class="photo"><img src="art_src.png"></div>
  <div class="bubble">口座開設<br>10月1日<br>スタート</div>
  <div class="copy">
    <div class="tag">学資保険のパンフレット、<br>置いたままになっていませんか。</div>
    <div class="tagline"></div>
    <div class="t1">漫画でわかる</div>
    <div class="t2">こどもNISA</div>
    <div class="t3">2027年スタート／0歳からの600万円<br>40ページのまんがで、ぜんぶわかる。</div>
  </div>
</div>

<div class="qs">
  <div class="q"><div class="circ"><svg viewBox="0 0 100 100"><rect x="12" y="58" width="18" height="30" rx="3" fill="#E8546B"/><rect x="41" y="38" width="18" height="50" rx="3" fill="#E8546B"/><rect x="70" y="18" width="18" height="70" rx="3" fill="#E8546B"/></svg></div><div class="lbl">学資保険と<br>どっちがいい？</div></div>
  <div class="q"><div class="circ"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#E8546B" stroke-width="9"/><text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="54" font-weight="bold" fill="#E8546B" font-family="IPAPGothic,sans-serif">¥</text></svg></div><div class="lbl">いくらから<br>始められる？</div></div>
  <div class="q"><div class="circ"><svg viewBox="0 0 100 100"><rect x="14" y="22" width="72" height="64" rx="8" fill="none" stroke="#E8546B" stroke-width="9"/><path d="M14 42h72M32 14v16M68 14v16" stroke="#E8546B" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="63" r="9" fill="#E8546B"/></svg></div><div class="lbl">10月1日に<br>何をすればいい？</div></div>
</div>

<div class="band">
  <div class="big">0歳から、18歳まで。<span class="l2"><span class="y">600万円</span>が非課税。</span></div>
  <div class="rule"></div>
</div>

<div class="cols">
  <div class="c">こどもNISAのしくみが<br>まんがでわかる</div>
  <div class="c">学資保険との違いを<br>どちらも否定せず比較</div>
  <div class="c">12歳まで引き出せない<br>壁も正直に書いた</div>
</div>

<div class="author">あさひ なぎさ</div>
