<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予想びより</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%8E</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="app-header">
    <div class="app-title">予想びより</div>
    <div class="app-sub">レースを選んでスタート</div>
  </div>
  <div class="disclaimer">予想は参考情報です。当たりを保証するものではありません。</div>

  <div class="section-block">
    <p class="section-title">開催日</p>
    <div class="chip-row" id="date-chips"></div>
  </div>

  <div class="section-block">
    <p class="section-title">中央 / 地方</p>
    <div class="toggle-pair" id="category-toggle">
      <button type="button" data-category="central" class="on">中央競馬</button>
      <button type="button" data-category="local" disabled title="準備中です">地方競馬(準備中)</button>
    </div>
  </div>

  <div class="section-block">
    <p class="section-title">競馬場</p>
    <div class="chip-row" id="venue-chips"></div>
  </div>

  <div class="section-block">
    <p class="section-title">レース番号(任意)</p>
    <div class="race-grid" id="race-grid"></div>
  </div>

  <div class="section-block">
    <button type="button" class="cta" id="submit-btn" disabled>この条件でレースを探す</button>
  </div>

  <nav class="footer-nav">
    <a class="is-active" href="/">予想する</a>
    <a href="/results.html">成績</a>
  </nav>
</div>

<script src="/js/top.js"></script>
</body>
</html>
